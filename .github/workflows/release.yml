name: Release

# Build LOCKED, source-hidden binaries (Nuitka) for each OS and attach them to a
# GitHub Release when a version tag is pushed:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# SOURCE IS NEVER SHIPPED — releases contain compiled binaries only, so buyers
# can't read or patch out the license check. If every build fails, no release
# is published (nothing leaks). The compiled app is self-contained: it punches
# via `<binary> --punch in|out`, schedules itself natively, and downloads
# Chromium through the bundled Playwright driver on first run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Auto-Keka-macos
            mode: app          # PyObjC (Dock identity) requires app mode
            macos_icon: icon.icns
            windows_icon: ""
          - os: windows-latest
            name: Auto-Keka-windows
            mode: onefile
            macos_icon: ""
            windows_icon: icon.ico
          - os: ubuntu-latest
            name: Auto-Keka-linux
            mode: onefile
            macos_icon: ""
            windows_icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate app icons
        shell: bash
        run: |
          python packaging/make_icon.py icon.png
          python packaging/make_icon.py icon.ico
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p AutoKeka.iconset
            for sz in 16 32 128 256 512; do
              sips -z $sz $sz icon.png --out "AutoKeka.iconset/icon_${sz}x${sz}.png" >/dev/null
              d=$((sz*2)); sips -z $d $d icon.png --out "AutoKeka.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
            done
            iconutil -c icns AutoKeka.iconset -o icon.icns
          fi

      - name: Compile with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: keka_ui.py
          mode: ${{ matrix.mode }}
          include-data-dir: ui=ui
          # NOTE: no include-package-data for playwright — Nuitka's built-in
          # playwright config already ships the driver, and adding it again
          # fatals with a data-file/exe conflict on macOS + Linux.
          include-module: |
            license
            keka_check
          windows-console-mode: disable
          # Real product identity baked into the binary (name/icon/metadata),
          # so the Dock/taskbar shows "Auto-Keka" before the app even runs.
          # Icon inputs are per-OS (empty ones are omitted by the action).
          macos-app-name: Auto-Keka
          macos-app-version: 1.0.1
          macos-app-icon: ${{ matrix.macos_icon }}
          windows-icon-from-ico: ${{ matrix.windows_icon }}
          company-name: Auto-Keka
          product-name: Auto-Keka
          product-version: 1.0.1
          file-description: Auto-Keka automatic Keka attendance

      - name: Package — macOS (.app)
        if: runner.os == 'macOS'
        run: |
          cd build
          mv keka_ui.app Auto-Keka.app
          ditto -c -k --keepParent Auto-Keka.app "../${{ matrix.name }}.zip"

      - name: Package — Linux (onefile binary)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp build/keka_ui.bin out/Auto-Keka
          chmod +x out/Auto-Keka
          cd out && zip "../${{ matrix.name }}.zip" Auto-Keka

      - name: Package — Windows (onefile exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item build\keka_ui.exe Auto-Keka.exe
          Compress-Archive -Path Auto-Keka.exe -DestinationPath "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    needs: build
    # Publish whatever compiled successfully; if nothing did, fail with no
    # release (never fall back to shipping source).
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/*/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "no binaries built — refusing to release"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Auto-Keka ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md || \
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}"
