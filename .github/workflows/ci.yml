name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── Full installer + Python smoke on all three OSes ──────────────────────────
  installer:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung installer should fail fast, not burn the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The installers read .env from the per-user data dir (keka_common.DATA_DIR),
      # not the repo. Seeding the repo copy left setup.ps1 waiting on Read-Host
      # until the job timed out.
      - name: Seed a dummy .env (so the installer runs non-interactively)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) dir="$(cygpath -u "$APPDATA")/Auto-Keka" ;;
            macOS)   dir="$HOME/Library/Application Support/Auto-Keka" ;;
            *)       dir="${XDG_DATA_HOME:-$HOME/.local/share}/Auto-Keka" ;;
          esac
          mkdir -p "$dir"
          printf 'KEKA_BASE_URL=https://example.keka.com\nKEKA_EMAIL=t@e.com\nKEKA_PASSWORD=dummy\n' > "$dir/.env"
          echo "seeded $dir/.env"

      # Windows: winget can't run headless in CI, so pre-install tesseract via
      # choco. This also exercises keka_common's "C:\Program Files" probe.
      - name: Install tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y

      - name: Run installer — Unix (setup.sh)
        if: runner.os != 'Windows'
        run: ./setup.sh --no-login --no-schedule

      - name: Run installer — Windows (setup.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1 -NoLogin -NoSchedule

      - name: Compile all scripts — Unix
        if: runner.os != 'Windows'
        run: ./.venv/bin/python -c "import py_compile,glob;[py_compile.compile(f,doraise=True) for f in glob.glob('*.py')]"

      - name: Compile all scripts — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import py_compile,glob;[py_compile.compile(f,doraise=True) for f in glob.glob('*.py')]"

      - name: Smoke test — Unix
        if: runner.os != 'Windows'
        run: ./.venv/bin/python .github/scripts/smoke.py

      # setup.sh installs WebKitGTK system-wide; the app runs from .venv. Guard
      # the bridge between them so the window can't silently regress to the browser.
      - name: Native window toolkit reachable from .venv — Linux
        if: runner.os == 'Linux'
        run: ./.venv/bin/python -c "import keka_doctor as d; b = d._native_window_backend(); print('native window:', b); assert b, 'pywebview would fall back to the browser'"

      - name: Smoke test — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe .github\scripts\smoke.py

      - name: Unit tests — Unix
        if: runner.os != 'Windows'
        run: |
          ./.venv/bin/python -m pip install --quiet -r requirements-dev.txt
          ./.venv/bin/python -m pytest tests/ -q

      - name: Unit tests — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --quiet -r requirements-dev.txt
          .\.venv\Scripts\python.exe -m pytest tests/ -q

  # ── Bash lint for the Unix installers ────────────────────────────────────────
  shell-lint:
    name: shell-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax)
        run: for f in setup.sh scheduling/install_linux.sh scheduling/install_macos.sh; do bash -n "$f"; done
      - name: shellcheck (errors fail the build)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error setup.sh scheduling/install_linux.sh scheduling/install_macos.sh

  # ── Real Windows validation of the PowerShell scripts ────────────────────────
  powershell:
    name: powershell (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse-check the .ps1 files
        shell: pwsh
        run: |
          foreach ($f in 'setup.ps1','scheduling/install_windows.ps1') {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errs)
            if ($errs.Count) { $errs | ForEach-Object { $_.Message }; throw "Parse errors in $f" }
            Write-Host "PARSE OK: $f"
          }

      - name: PSScriptAnalyzer (fail on errors)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = @()
          foreach ($f in 'setup.ps1','scheduling/install_windows.ps1') {
            $r += Invoke-ScriptAnalyzer -Path $f -Severity Error,Warning
          }
          $r | Format-Table -AutoSize
          if ($r | Where-Object { $_.Severity -eq 'Error' }) { throw "PSScriptAnalyzer reported errors" }

      - name: ScheduledTasks cmdlets accept our exact arguments
        shell: pwsh
        run: |
          $t = New-ScheduledTaskTrigger -Weekly -DaysOfWeek Monday,Tuesday,Wednesday,Thursday,Friday -At "09:00"
          $a = New-ScheduledTaskAction  -Execute "python.exe" -Argument '"C:\Program Files\keka\keka_punch_in.py"'
          $p = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive -RunLevel Limited
          if ($t -and $a -and $p) { Write-Host "ScheduledTasks cmdlets OK (paths with spaces handled)" }
          else { throw "ScheduledTasks cmdlet build failed" }

      - name: setup.ps1 -Help runs
        shell: pwsh
        run: ./setup.ps1 -Help
