name: Release

# Build LOCKED, source-hidden binaries (Nuitka) for each OS and attach them to a
# GitHub Release when a version tag is pushed:
#
#     git tag v1.1.0 && git push origin v1.1.0
#
# NOTE: this ships COMPILED binaries, never source. Playwright + Nuitka bundling
# can need per-OS tweaks — validate with a test tag before relying on it. A failed
# build simply produces no release (safe: nothing is leaked).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Auto-Keka-macos
          - os: windows-latest
            name: Auto-Keka-windows
          - os: ubuntu-latest
            name: Auto-Keka-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: keka_ui.py
          mode: onefile
          include-data-dir: ui=ui
          include-module: license

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p out
          # Nuitka drops the binary in build/ — grab whatever it produced.
          cp -R build/keka_ui* "out/${{ matrix.name }}" 2>/dev/null || \
          cp -R build/*.app   "out/${{ matrix.name }}.app" 2>/dev/null || true
          ( cd out && zip -r "${{ matrix.name }}.zip" . )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}.zip

  # The documented install flow (README + release notes) is the SOURCE zip with
  # the double-click launchers — this job guarantees it exists on every release.
  # git archive packs TRACKED files only, so .env/session/keys can never leak.
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source zip
        run: git archive --format=zip --prefix=Auto-Keka/ -o Auto-Keka.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Auto-Keka-source
          path: Auto-Keka.zip

  release:
    needs: [build, source]
    # Publish even if the (experimental) compiled builds fail — the source zip
    # is the primary download and must always ship.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/*/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "no artifacts produced"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Auto-Keka ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md || \
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}"
