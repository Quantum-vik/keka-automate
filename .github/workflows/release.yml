name: Release

# Build LOCKED, source-hidden binaries (Nuitka) for each OS and attach them to a
# GitHub Release when a version tag is pushed:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# SOURCE IS NEVER SHIPPED — releases contain compiled binaries only, so buyers
# can't read or patch out the license check. If every build fails, no release
# is published (nothing leaks). The compiled app is self-contained: it punches
# via `<binary> --punch in|out`, schedules itself natively, and downloads
# Chromium through the bundled Playwright driver on first run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Auto-Keka-macos
            mode: app          # PyObjC (Dock identity) requires app mode
            macos_icon: icon.icns
            windows_icon: ""
          - os: windows-latest
            name: Auto-Keka-windows
            mode: onefile
            macos_icon: ""
            windows_icon: icon.ico
          # Build on the OLDEST supported runner: Nuitka links against the build
          # host's glibc, so ubuntu-latest (24.04, glibc 2.39) produced a binary
          # that failed on Ubuntu 22.04 / Debian 12 with "GLIBC_2.38 not found".
          # 22.04 (glibc 2.35) covers far more distros.
          - os: ubuntu-22.04
            name: Auto-Keka-linux
            mode: onefile
            macos_icon: ""
            windows_icon: ""
    runs-on: ${{ matrix.os }}
    # Signing is OPTIONAL and OS-gated (the munder-difflin pattern): these map
    # secret PRESENCE to a boolean the signing steps guard on, so a repo with no
    # certificates set just builds unsigned and stays green — forks included.
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read app version
        id: ver
        shell: bash
        run: |
          # Single source of truth: keka_common.APP_VERSION. Grep it (no import,
          # so heavy deps aren't needed) and feed it to the Nuitka options below.
          v=$(grep -E '^APP_VERSION *=' keka_common.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$v" ] || { echo "APP_VERSION not found in keka_common.py"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "app version: $v"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate app icons
        shell: bash
        run: |
          python packaging/make_icon.py icon.png
          python packaging/make_icon.py icon.ico
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p AutoKeka.iconset
            for sz in 16 32 128 256 512; do
              sips -z $sz $sz icon.png --out "AutoKeka.iconset/icon_${sz}x${sz}.png" >/dev/null
              d=$((sz*2)); sips -z $d $d icon.png --out "AutoKeka.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
            done
            iconutil -c icns AutoKeka.iconset -o icon.icns
          fi

      - name: Compile with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: keka_ui.py
          mode: ${{ matrix.mode }}
          include-data-dir: ui=ui
          # NOTE: no include-package-data for playwright — Nuitka's built-in
          # playwright config already ships the driver, and adding it again
          # fatals with a data-file/exe conflict on macOS + Linux.
          include-module: |
            license
            keka_check
          windows-console-mode: disable
          # Real product identity baked into the binary (name/icon/metadata),
          # so the Dock/taskbar shows "Auto-Keka" before the app even runs.
          # Icon inputs are per-OS (empty ones are omitted by the action).
          macos-app-name: Auto-Keka
          macos-app-version: ${{ steps.ver.outputs.v }}
          macos-app-icon: ${{ matrix.macos_icon }}
          windows-icon-from-ico: ${{ matrix.windows_icon }}
          company-name: Auto-Keka
          product-name: Auto-Keka
          product-version: ${{ steps.ver.outputs.v }}
          file-description: Auto-Keka automatic Keka attendance

      - name: Package — macOS (.app)
        if: runner.os == 'macOS'
        run: |
          cd build
          mv keka_ui.app Auto-Keka.app
          ditto -c -k --keepParent Auto-Keka.app "../${{ matrix.name }}.zip"

      - name: Sign & notarize — macOS (optional)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/sign_macos.sh build/Auto-Keka.app "${{ matrix.name }}.zip"

      - name: Package — Linux (onefile binary)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp build/keka_ui.bin out/Auto-Keka
          chmod +x out/Auto-Keka
          cd out && zip "../${{ matrix.name }}.zip" Auto-Keka

      - name: Package — Windows (onefile exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item build\keka_ui.exe Auto-Keka.exe
          if ($env:HAS_WINDOWS_SIGNING -eq 'true') {
            powershell -ExecutionPolicy Bypass -File packaging\sign_windows.ps1 -Exe Auto-Keka.exe
          }
          Compress-Archive -Path Auto-Keka.exe -DestinationPath "${{ matrix.name }}.zip"
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # ── Build-correctness smoke test: RUN the compiled artifact before we
      #    upload it, so a binary that compiles but is broken at runtime (missing
      #    bundled data/module, bad entry point) fails the build instead of the
      #    user's machine. macOS/Linux get the deep probe (--version + --serve +
      #    /api/state + dashboard); Windows gets the --version launch check.
      - name: Smoke test — macOS
        if: runner.os == 'macOS'
        run: |
          exe="$(find build/Auto-Keka.app/Contents/MacOS -type f -perm +111 | head -1)"
          [ -n "$exe" ] || { echo "no executable inside Auto-Keka.app"; exit 1; }
          bash packaging/smoke_test.sh "$exe"

      - name: Smoke test — Linux
        if: runner.os == 'Linux'
        run: bash packaging/smoke_test.sh out/Auto-Keka

      - name: Smoke test — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & .\Auto-Keka.exe --version
          Write-Host "smoke: $out"
          if ($out -notmatch '^Auto-Keka ') { throw "smoke FAIL: unexpected --version output: $out" }
          Write-Host "smoke: OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  # ── Native macOS client (SwiftUI menu-bar app over the compiled core) ───────
  # Reuses the macOS binary the matrix above already produced: that binary IS
  # keka_ui.py compiled, so it already answers `--serve`. Nothing extra is
  # compiled on the Python side.
  macos-native:
    name: macOS native client
    needs: build
    # Never block the release: if this fails, the cross-platform builds still
    # ship (the release job below runs with always()).
    if: always() && !cancelled()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the compiled macOS core
        uses: actions/download-artifact@v4
        with:
          name: Auto-Keka-macos
          path: core

      - name: Locate the core executable
        id: core
        run: |
          cd core
          unzip -q Auto-Keka-macos.zip
          # Nuitka names the binary after the script, and the app-name option
          # only sets the display name — so find it rather than hardcode it.
          exe=$(find Auto-Keka.app/Contents/MacOS -type f -perm +111 | head -1)
          [ -n "$exe" ] || { echo "no executable inside Auto-Keka.app"; exit 1; }
          echo "path=$PWD/$exe" >> "$GITHUB_OUTPUT"
          echo "found core: $exe"

      - name: Build the native client
        run: ./macos/build-app.sh --release --core "${{ steps.core.outputs.path }}"

      - name: Verify the bundle
        run: |
          app="macos/build/Auto-Keka Native.app"
          test -x "$app/Contents/MacOS/AutoKeka"      || { echo "missing client binary"; exit 1; }
          test -x "$app/Contents/MacOS/auto-keka-core" || { echo "core was not bundled"; exit 1; }
          # A dev-fallback key here would mean the release build is still
          # pointing at somebody's checkout.
          if /usr/libexec/PlistBuddy -c "Print :AutoKekaRepo" "$app/Contents/Info.plist" >/dev/null 2>&1; then
            echo "release bundle contains the dev repo fallback"; exit 1
          fi
          echo "bundle verified"

      - name: Package
        run: |
          cd macos/build
          ditto -c -k --keepParent "Auto-Keka Native.app" ../../Auto-Keka-macos-native.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Auto-Keka-macos-native
          path: Auto-Keka-macos-native.zip

  release:
    needs: [build, macos-native]
    # Publish whatever compiled successfully; if nothing did, fail with no
    # release (never fall back to shipping source).
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/*/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "no binaries built — refusing to release"; exit 1; }

          # SHA256SUMS so downloaders can verify integrity (munder-difflin ships
          # per-OS sums; one combined file is enough here). sha256sum on Linux.
          sums="SHA256SUMS.txt"
          : > "$sums"
          for f in "${files[@]}"; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$sums"
          done
          echo "checksums:"; cat "$sums"

          # A hyphen in the tag (v1.2.0-rc.1, -beta) marks a PRE-release, so
          # in-app "latest" checks won't auto-offer an untested build.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac

          gh release create "${GITHUB_REF_NAME}" "${files[@]}" "$sums" $prerelease \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Auto-Keka ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md || \
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" "$sums" --repo "${GITHUB_REPOSITORY}"
